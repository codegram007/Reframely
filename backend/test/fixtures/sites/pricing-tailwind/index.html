<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Relay — Pricing</title>
  <link rel="stylesheet" href="tailwind.css">
</head>
<body class="bg-white">
  <section id="pricing" class="py-24 bg-gray-50 text-center">
    <h1 class="text-4xl font-bold mb-8">Simple pricing</h1>
    <div class="mx-auto max-w-5xl flex flex-col md:flex-row gap-8 pricing-cards">
      <div class="flex-1 p-6 rounded-xl shadow bg-white">
        <h3 class="text-xl font-bold mb-4">Hobby</h3>
        <p class="text-4xl font-bold mb-4">$0</p>
        <ul class="mb-8">
          <li>1 project</li>
          <li>Community support</li>
          <li>1 GB storage</li>
        </ul>
        <a class="inline-block bg-indigo-600 text-white px-8 py-4 rounded-lg" href="#signup">Start free</a>
      </div>
      <div class="flex-1 p-6 rounded-xl shadow bg-white">
        <h3 class="text-xl font-bold mb-4">Pro</h3>
        <p class="text-4xl font-bold mb-4">$19</p>
        <ul class="mb-8">
          <li>Unlimited projects</li>
          <li>Email support</li>
          <li>100 GB storage</li>
        </ul>
        <a class="inline-block bg-indigo-600 text-white px-8 py-4 rounded-lg" href="#signup">Go Pro</a>
      </div>
      <div class="flex-1 p-6 rounded-xl shadow bg-white">
        <h3 class="text-xl font-bold mb-4">Team</h3>
        <p class="text-4xl font-bold mb-4">$49</p>
        <ul class="mb-8">
          <li>Everything in Pro</li>
          <li>SSO &amp; audit log</li>
          <li>Priority support</li>
        </ul>
        <a class="inline-block bg-indigo-600 text-white px-8 py-4 rounded-lg" href="#signup">Contact us</a>
      </div>
    </div>
  </section>
  <footer class="bg-gray-900 py-16 text-center">
    <p class="text-gray-500">Relay — pipelines for humans.</p>
  </footer>
</body>
</html>
