[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy REST/API requests to the separately hosted Fastify service. Keep this
# before the SPA fallback so `/api/*` is never served as index.html.
[[redirects]]
  from = "/api/*"
  to = "https://reframely-backend.onrender.com/:splat"
  status = 200
  force = true

# React Router fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
